name: Bug report
description: Something in the client, server, or docs does not work as described
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Leave out xAI API keys, `PI_API_SECRET`, and the contents of `~/.pi-orbs/state.json`. Security issues belong in [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, clicks, and the sprite name (the name is fine; the key and API secret are not).
      placeholder: |
        1. npm run build && npm start
        2. Open http://127.0.0.1:8787
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pi-orbs version
      description: npm package version, or the git commit if you are on a checkout.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v20.x"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs with secrets removed, screenshots, or whether this is the local client or the server on the Sprite.
    validations:
      required: false
