name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Build
        run: npm run build

      # Server tests need node:sqlite, which Node 20 does not provide.
      # Client simulator tests run on Node 20. Node 22 runs them via npm test.
      - name: Test client simulator
        if: matrix.node-version == 20 || matrix.node-version == '20'
        run: npm run test:client

      - name: Test
        if: matrix.node-version == 22 || matrix.node-version == '22'
        run: npm test
