name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client

      - name: Build
        run: npm run build

      # Server tests need node:sqlite, which Node 20 does not provide.
      # Client simulator tests run on Node 20. Node 22 runs them via npm test.
      - name: Test client simulator
        if: matrix.node-version == 20 || matrix.node-version == '20'
        run: npm run test:client

      - name: Test
        if: matrix.node-version == 22 || matrix.node-version == '22'
        run: npm test

  e2e:
    name: e2e (simulator, no secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix client

      - name: Build client
        run: npm run build --prefix client

      - name: Install Chromium
        run: npx @e2e-dev/web install chromium --with-deps

      # Deterministic checks, plus replay of committed agent.act steps.
      # This job has no API key. Live model chat is npm run test:e2e:live.
      - name: Run e2e
        run: npx e2e run --reporter list,junit
        env:
          E2E_TELEMETRY_DISABLED: "1"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/junit.xml
          if-no-files-found: warn
