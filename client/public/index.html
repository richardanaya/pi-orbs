<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Pi Orbs</title>
<link rel="icon" href="/logo.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --text: #f3f4f5;
    --muted: #8d959e;
    --line: rgba(255, 255, 255, 0.1);
    --line-strong: rgba(255, 255, 255, 0.18);
    --fill: rgba(255, 255, 255, 0.04);
    --fill-strong: rgba(255, 255, 255, 0.07);
    --danger: #ffb3b8;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.5 var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button[disabled] { opacity: 0.4; cursor: default; }
  ::placeholder { color: #7e868e; }
  ::selection { background: rgba(255, 255, 255, 0.18); color: #fff; }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
  }
  input:focus-visible { outline: none; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  #setup {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 48px 24px;
    background:
      radial-gradient(560px 420px at 50% 36%, rgba(255, 255, 255, 0.07), transparent 68%),
      var(--bg);
  }
  body.ready #setup { display: none; }
  .card { width: min(420px, 100%); text-align: center; }
  .glow {
    position: relative;
    display: inline-grid;
    place-items: center;
    isolation: isolate;
  }
  .glow::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 150%;
    height: 150%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06) 42%, transparent 68%);
    filter: blur(8px);
    z-index: 0;
    pointer-events: none;
  }
  .glow img { position: relative; z-index: 1; display: block; }
  .setup-glow { width: 132px; height: 132px; margin: 0 auto 18px; }
  .setup-mark { width: 132px; height: 132px; }
  .card h1 {
    margin: 0;
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  #setup-copy, #status {
    color: var(--muted);
    margin: 14px auto 0;
    max-width: 34ch;
    text-wrap: pretty;
  }
  #status:empty { display: none; }
  #status { margin-top: 16px; min-height: 1.5em; }
  #create-sprite { margin-top: 28px; text-align: left; }
  .card input, #send input, #create-bot input {
    width: 100%;
    border: 1px solid var(--line-strong);
    background: #000;
    border-radius: 14px;
    padding: 14px 16px;
    outline: none;
  }
  .card input { margin: 0 0 10px; }
  .card input:focus, #create-bot:focus-within, #send:focus-within {
    border-color: rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.06);
  }
  #create-button, .send, #create-bot button {
    border: 0;
    background: #fff;
    color: #0a0a0a;
    font-weight: 600;
  }
  #create-button {
    width: 100%;
    margin-top: 6px;
    border-radius: 14px;
    padding: 14px 18px;
    letter-spacing: -0.01em;
  }
  #create-button:hover, #create-bot button:hover, .send:hover { background: #eceeed; }
  #create-button:focus-visible, .send:focus-visible, #create-bot button:focus-visible { outline-offset: 3px; }

  main {
    display: none;
    height: 100%;
    grid-template-columns: 300px minmax(0, 1fr);
  }
  body.ready main { display: grid; }
  aside {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: #000;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 16px 14px;
  }
  .brand-glow { width: 34px; height: 34px; flex: none; }
  .brand-glow::before { filter: blur(5px); width: 160%; height: 160%; }
  .mark { width: 34px; height: 34px; }
  .brand strong {
    display: block;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .version {
    margin-left: auto;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 8px;
    line-height: 1.4;
  }
  .side-label {
    margin: 4px 18px 2px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #bots {
    flex: 1;
    overflow: auto;
    padding: 6px 10px 8px;
    scrollbar-width: thin;
    scrollbar-color: #2a2e32 transparent;
  }
  .row {
    width: 100%;
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 8px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    text-align: left;
    color: inherit;
  }
  .row:hover { background: var(--fill); }
  .row.on { background: var(--fill-strong); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
  .avatar {
    --orb: #2c3136;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.55);
    background:
      radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0) 34%),
      radial-gradient(circle at 68% 82%, rgba(0, 0, 0, 0.45), transparent 46%),
      radial-gradient(circle at 50% 42%, var(--orb), #090a0b 74%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -10px 14px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.06);
  }
  .avatar[data-tone="0"] { --orb: #2a2f34; }
  .avatar[data-tone="1"] { --orb: #353b41; }
  .avatar[data-tone="2"] { --orb: #22272c; }
  .avatar.sm { width: 32px; height: 32px; font-size: 13px; }
  .row .name { font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
  .row .sub { color: var(--muted); font-size: 13px; line-height: 1.3; }
  #create-bot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 12px 12px;
    padding: 4px 4px 4px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: #000;
  }
  #create-bot input {
    border: 0;
    background: transparent;
    padding: 8px 0;
    border-radius: 0;
    min-width: 0;
  }
  #create-bot input:focus { box-shadow: none; }
  #create-bot button {
    border-radius: 999px;
    padding: 8px 14px;
    flex: none;
  }
  .side-foot { border-top: 1px solid var(--line); padding: 8px 8px 12px; }
  #settings-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 0;
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 12px;
    text-align: left;
  }
  #settings-toggle:hover { background: var(--fill); color: var(--text); }
  #settings-toggle::after {
    content: "";
    margin-left: auto;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg) translate(-1px, -1px);
  }
  #settings-toggle[aria-expanded="true"]::after {
    transform: rotate(225deg) translate(-1px, -1px);
  }
  #settings { display: none; padding: 4px 8px 2px; }
  #settings.open { display: block; }
  #settings p, #sprite-meta {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
    margin: 0 0 10px;
  }
  #sprite-meta {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding: 0 4px;
  }
  #settings .hint { padding: 0 4px; }
  #settings button {
    margin: 0 8px 8px 0;
    border-radius: 999px;
    padding: 8px 12px;
    background: transparent;
    border: 1px solid var(--line-strong);
    color: var(--text);
    font-size: 13px;
  }
  #settings button:hover { background: var(--fill); }
  #destroy {
    color: var(--danger);
    border-color: rgba(255, 140, 148, 0.4);
    background: rgba(255, 80, 90, 0.06);
  }
  #destroy:hover { background: rgba(255, 80, 90, 0.12); }

  .thread {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background:
      radial-gradient(720px 280px at 50% -40px, rgba(255, 255, 255, 0.045), transparent 70%),
      #000;
  }
  .thread-bar {
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 28px;
    border-bottom: 1px solid var(--line);
  }
  .thread-name {
    font-weight: 600;
    letter-spacing: -0.03em;
    font-size: 16px;
    line-height: 1.2;
  }
  .thread-sub { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .thread-sub:empty, .thread-sub[hidden], #thread-avatar[hidden] { display: none; }
  #log {
    flex: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
    padding: 28px max(28px, calc((100% - 760px) / 2)) 12px;
    scrollbar-width: thin;
    scrollbar-color: #2a2e32 transparent;
  }
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    width: fit-content;
    max-width: min(620px, 100%);
    margin: 0 0 14px;
  }
  .msg.cont { margin-top: -6px; }
  .msg.cont.bot .avatar { visibility: hidden; }
  .msg.user { margin-left: auto; flex-direction: row-reverse; }
  .bubble {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    line-height: 1.5;
  }
  .msg.bot .bubble {
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px 18px 18px 18px;
    padding: 10px 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, #2a2e33, #1c1f23);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px 18px 6px 18px;
    padding: 10px 14px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .composer { padding: 8px max(28px, calc((100% - 760px) / 2)) 24px; }
  #send {
    display: flex;
    gap: 8px;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    background: #050505;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
  }
  #send input { border: 0; background: transparent; padding: 10px 0; border-radius: 0; }
  #send input:focus { box-shadow: none; }
  .send {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: none;
  }
  .send svg { display: block; }
  .empty {
    margin: auto;
    text-align: center;
    padding: 24px 16px 48px;
  }
  .empty-glow { width: 84px; height: 84px; margin: 0 auto 14px; }
  .empty-glow::before { width: 170%; height: 170%; filter: blur(10px); }
  .empty-mark { width: 84px; height: 84px; }
  .empty-title {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .empty-copy {
    margin: 8px auto 0;
    max-width: 32ch;
    color: var(--muted);
    text-wrap: pretty;
  }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(220px, 42vh) minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .thread-bar, .composer { padding-left: 16px; padding-right: 16px; }
    #log { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
      scroll-behavior: auto !important;
    }
    .glow::before { filter: none; }
  }
</style>
</head>
<body>
<div id="setup">
  <div class="card">
    <div class="glow setup-glow"><img class="setup-mark" src="/logo.png" alt="Pi Orbs"></div>
    <h1>Pi Orbs</h1>
    <p id="setup-copy">Name the computer and give it an xAI key. Nothing else runs until that sprite is up.</p>
    <form id="create-sprite">
      <label class="sr-only" for="sprite-name">Sprite name</label>
      <input id="sprite-name" name="name" placeholder="Sprite name" autocomplete="off" required>
      <label class="sr-only" for="xai-key">xAI key</label>
      <input id="xai-key" name="xai" placeholder="xAI key" type="password" autocomplete="off" required>
      <button id="create-button" type="submit">Create and deploy</button>
    </form>
    <p id="status" role="status"></p>
  </div>
</div>
<main>
  <aside aria-label="Roster">
    <div class="brand">
      <div class="glow brand-glow"><img class="mark" src="/logo.png" alt=""></div>
      <strong>Pi Orbs</strong>
      <span id="version" class="version"></span>
    </div>
    <div class="side-label">Bots</div>
    <div id="bots"></div>
    <form id="create-bot">
      <label class="sr-only" for="new-bot">New bot name</label>
      <input id="new-bot" name="name" placeholder="New bot" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <div class="side-foot">
      <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings">Settings</button>
      <div id="settings">
        <p id="sprite-meta"></p>
        <p class="hint">Destroying the sprite deletes its disk, bots, and URL.</p>
        <button id="deploy" type="button">Push server build</button>
        <button id="destroy" type="button">Destroy sprite</button>
      </div>
    </div>
  </aside>
  <section class="thread" aria-label="Thread">
    <div class="thread-bar">
      <div class="avatar sm" id="thread-avatar" hidden></div>
      <div>
        <div class="thread-name" id="thread-name">Choose a bot</div>
        <div class="thread-sub" id="thread-sub" hidden></div>
      </div>
    </div>
    <div id="log"></div>
    <div class="composer">
      <form id="send">
        <label class="sr-only" for="message">Message</label>
        <input id="message" name="content" placeholder="Message" autocomplete="off" required>
        <button class="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 19V6M12 6l-5.5 5.5M12 6l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
  </section>
</main>
<script>
const state = { sprite: null, bot: null };
function initial(name) { return (name || "?").trim().slice(0, 1).toUpperCase(); }
function tone(name) {
  let h = 0;
  for (const c of name || "?") h = (h + c.charCodeAt(0)) % 3;
  return String(h);
}
function paintAvatar(node, name) {
  node.textContent = initial(name);
  node.dataset.tone = tone(name);
  node.hidden = false;
}
async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}
function showSetup(copy) {
  document.body.classList.remove("ready");
  document.querySelector("#setup-copy").textContent = copy;
}
function setThreadHead(name, sub) {
  document.querySelector("#thread-name").textContent = name;
  const subEl = document.querySelector("#thread-sub");
  const face = document.querySelector("#thread-avatar");
  if (!sub) {
    subEl.hidden = true;
    subEl.textContent = "";
    face.hidden = true;
    return;
  }
  subEl.hidden = false;
  subEl.textContent = sub;
  paintAvatar(face, name);
}
function setComposer(enabled, placeholder) {
  const input = document.querySelector("#message");
  input.disabled = !enabled;
  input.placeholder = placeholder;
  document.querySelector("#send button").disabled = !enabled;
}
function showEmpty(title, copy) {
  const empty = document.createElement("div");
  empty.className = "empty";
  const glow = document.createElement("div");
  glow.className = "glow empty-glow";
  const mark = document.createElement("img");
  mark.src = "/logo.png";
  mark.alt = "";
  mark.className = "empty-mark";
  glow.append(mark);
  const heading = document.createElement("p");
  heading.className = "empty-title";
  heading.textContent = title;
  const text = document.createElement("p");
  text.className = "empty-copy";
  text.textContent = copy;
  empty.append(glow, heading, text);
  return empty;
}
async function refreshHome() {
  const body = await api("/api/sprites");
  document.querySelector("#version").textContent = body.localVersion;
  if (!body.sprite) {
    state.sprite = null;
    state.bot = null;
    showSetup("Name the computer and give it an xAI key. Nothing else runs until that sprite is up.");
    return;
  }
  state.sprite = body.sprite.name;
  if (!body.sprite.remoteVersion) {
    showSetup(body.sprite.name + " exists, but its server is not answering. Finish deploy uses the key already saved on this machine.");
    const form = document.querySelector("#create-sprite");
    form.querySelector("[name=name]").value = body.sprite.name;
    form.querySelector("[name=xai]").required = false;
    form.querySelector("[name=xai]").placeholder = "xAI key, only to replace it";
    document.querySelector("#create-button").textContent = "Finish deploy";
    return;
  }
  document.querySelector("#create-sprite [name=xai]").required = true;
  document.querySelector("#create-button").textContent = "Create and deploy";
  document.body.classList.add("ready");
  await refreshBots(body.sprite);
}
async function refreshBots(sprite) {
  const meta = document.querySelector("#sprite-meta");
  const box = document.querySelector("#bots");
  const body = sprite && sprite.bots ? sprite : await api("/api/sprites/" + state.sprite);
  meta.textContent = body.url + "\nrunning " + (body.remoteVersion || "nothing") + (body.update ? " · update available" : "");
  const bots = body.bots || [];
  if (!state.bot && bots[0]) state.bot = bots[0].id;
  if (state.bot && !bots.some((bot) => bot.id === state.bot)) state.bot = bots[0] ? bots[0].id : null;
  box.innerHTML = "";
  for (const bot of bots) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row" + (state.bot === bot.id ? " on" : "");
    row.setAttribute("aria-pressed", state.bot === bot.id ? "true" : "false");
    const face = document.createElement("div");
    face.className = "avatar";
    paintAvatar(face, bot.name);
    const text = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = bot.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = state.sprite;
    text.append(name, sub);
    row.append(face, text);
    row.onclick = () => { state.bot = bot.id; refreshBots(); refreshThread(); };
    box.appendChild(row);
  }
  if (state.bot) refreshThread();
  else {
    setThreadHead("Choose a bot", "");
    setComposer(false, "Message");
    const log = document.querySelector("#log");
    log.innerHTML = "";
    log.append(showEmpty("Choose a bot", "The roster is on the left. Each bot keeps its own thread."));
  }
}
async function refreshThread() {
  const log = document.querySelector("#log");
  if (!state.sprite || !state.bot) {
    log.innerHTML = "";
    setThreadHead("Choose a bot", "");
    setComposer(false, "Message");
    return;
  }
  const body = await api("/api/sprites/" + state.sprite + "/bots/" + state.bot);
  setThreadHead(body.bot.name, state.sprite);
  setComposer(true, "Message " + body.bot.name);
  log.innerHTML = "";
  if (!body.messages.length) {
    log.append(showEmpty(body.bot.name, "This thread is empty. Send a message to start it."));
    return;
  }
  let previous = "";
  for (const message of body.messages) {
    const mine = message.kind === "pi.user";
    const kind = mine ? "user" : "bot";
    const block = document.createElement("div");
    block.className = "msg " + kind + (previous === kind ? " cont" : "");
    previous = kind;
    if (!mine) {
      const face = document.createElement("div");
      face.className = "avatar sm";
      paintAvatar(face, body.bot.name);
      block.append(face);
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = message.text;
    block.append(bubble);
    log.append(block);
  }
  log.scrollTop = log.scrollHeight;
}
document.querySelector("#create-sprite").onsubmit = async (event) => {
  event.preventDefault();
  const button = document.querySelector("#create-button");
  const status = document.querySelector("#status");
  const data = new FormData(event.target);
  button.disabled = true;
  status.textContent = "Creating the sprite and installing the server. This takes a few minutes.";
  try {
    const name = data.get("name");
    const existing = state.sprite === name;
    if (existing && !data.get("xai")) {
      await api("/api/sprites/" + name + "/deploy", { method: "POST" });
    } else {
      await api("/api/sprites", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, xaiKey: data.get("xai") }) });
    }
    event.target.reset();
    status.textContent = "";
    await refreshHome();
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
};
document.querySelector("#create-bot").onsubmit = async (event) => {
  event.preventDefault();
  if (!state.sprite) return;
  const data = new FormData(event.target);
  const button = event.target.querySelector("button");
  button.disabled = true;
  try {
    const bot = await api("/api/sprites/" + state.sprite + "/bots", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name: data.get("name") }) });
    state.bot = bot.id;
    event.target.reset();
    await refreshBots();
  } finally {
    button.disabled = false;
  }
};
document.querySelector("#settings-toggle").onclick = () => {
  const panel = document.querySelector("#settings");
  const open = panel.classList.toggle("open");
  document.querySelector("#settings-toggle").setAttribute("aria-expanded", open ? "true" : "false");
};
document.querySelector("#deploy").onclick = async () => {
  if (!state.sprite) return;
  document.querySelector("#sprite-meta").textContent = "Pushing build…";
  try {
    await api("/api/sprites/" + state.sprite + "/deploy", { method: "POST" });
    await refreshBots();
  } catch (error) {
    document.querySelector("#sprite-meta").textContent = error.message;
  }
};
document.querySelector("#destroy").onclick = async () => {
  if (!state.sprite) return;
  const name = state.sprite;
  if (!confirm("Destroy " + name + "? This deletes the sprite and its bots.")) return;
  await api("/api/sprites/" + name, { method: "DELETE" });
  state.sprite = null;
  state.bot = null;
  document.querySelector("#settings").classList.remove("open");
  document.querySelector("#settings-toggle").setAttribute("aria-expanded", "false");
  await refreshHome();
};
document.querySelector("#send").onsubmit = async (event) => {
  event.preventDefault();
  if (!state.sprite || !state.bot) return;
  const data = new FormData(event.target);
  const button = event.target.querySelector("button");
  button.disabled = true;
  try {
    await api("/api/sprites/" + state.sprite + "/bots/" + state.bot + "/messages", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ content: data.get("content") }) });
    event.target.reset();
    setTimeout(refreshThread, 1500);
  } finally {
    button.disabled = false;
  }
};
refreshHome().catch((error) => { document.querySelector("#status").textContent = error.message; });
setInterval(() => { if (state.bot) refreshThread(); }, 3000);
</script>
</body>
</html>
